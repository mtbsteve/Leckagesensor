# Home Assistant: Einstellungen -> Automatisierungen -> Neu -> ⋮ -> In YAML bearbeiten
# Entity-IDs ggf. an deine Installation anpassen (Geräteseite -> Entität -> Zahnrad)
alias: "Leckage-Verdacht"
triggers:
  - trigger: state
    entity_id: binary_sensor.leckage_sensor_leckage_verdacht_mikro
    to: "on"
    id: mikro
  - trigger: state
    entity_id: binary_sensor.leckage_sensor_leckage_verdacht_dauerfluss
    to: "on"
    id: dauer
actions:
  - action: notify.notify
    data:
      title: "Leckage-Verdacht"
      message: >-
        {% if trigger.id == 'mikro' %}
        Mikroleck-Verdacht – bitte prüfen und am Gerät „Leckverdacht quittieren“ drücken.
        {% else %}
        Seit über 90 min Dauerfluss erkannt.
        {% endif %}
mode: single
