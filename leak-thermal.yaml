# Thermischer Leckagesensor (Clamp-on) für Edelstahl-Trinkwasserleitung 35 mm
# ESP32-DevKitC-32E, 2 × DS18B20, IRLZ44N, Polyimid-Heizmatte 22 Ω an 5 V
# Doku: README.md

substitutions:
  addr_ref: "0x0000000000000000"     # Adresse Referenz-Sensor (aus Log: "Found devices")
  addr_heat: "0x0000000000000000"    # Adresse beheizter Sensor
  heater_level: "80%"                # 80 % = 0,94 W, 100 % = 1,14 W (bei 22 Ω)

esphome:
  name: leak-thermal
  friendly_name: Leckage-Sensor

esp32:
  board: esp32dev
  framework: { type: esp-idf }

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                  # Notfall-Hotspot zur WLAN-Einrichtung
    ssid: "leak-thermal Fallback"
    password: !secret leak_thermal_ap_password
captive_portal:

api:
  encryption:
    key: !secret leak_thermal_api_key
  actions:
    - action: korrigiere_offset        # Offset per HA-Aktion verschieben: dt_offset -= wert
      variables:
        wert: float
      then:
        - lambda: 'id(dt_offset) -= wert;'

ota:
  - platform: esphome
    password: !secret leak_thermal_ota_password

logger:

one_wire:
  - platform: gpio
    pin: GPIO4                         # J3-13

output:
  - platform: ledc
    pin: GPIO25                        # J2-9 -> Gate IRLZ44N
    id: heater
    frequency: 1000 Hz

globals:
  - id: dt_offset                      # Sensor-Offset (am Tisch kalibriert)
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: leak_latched                   # Mikroleck-Verdacht, bleibt bis Quittierung (auch über Neustart)
    type: bool
    restore_value: true
    initial_value: 'false'

switch:
  - platform: template
    id: heater_on
    name: "Heizung"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - output.set_level: { id: heater, level: "${heater_level}" }
    turn_off_action:
      - output.turn_off: heater

number:
  - platform: template
    id: rise_thr
    name: "Leck-Schwelle Anstieg"
    unit_of_measurement: "K"
    min_value: 0.05
    max_value: 0.50
    step: 0.01
    initial_value: 0.10
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: "Offset kalibrieren (am Tisch, Heizung aus)"
    on_press:
      - lambda: 'id(dt_offset) += id(delta_t).state;'
  - platform: template
    name: "Leckverdacht quittieren"
    on_press:
      - lambda: |-
          id(leak_latched) = false;
          id(leak_micro).publish_state(false);

sensor:
  - platform: dallas_temp
    id: t_ref
    name: "Rohr Referenz"
    address: ${addr_ref}
    resolution: 12
    update_interval: 15s
  - platform: dallas_temp
    id: t_heat
    name: "Rohr beheizt"
    address: ${addr_heat}
    resolution: 12
    update_interval: 15s

  - platform: template
    id: delta_t
    name: "Rohr ΔT"
    unit_of_measurement: "K"
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      if (isnan(id(t_heat).state) || isnan(id(t_ref).state)) return NAN;
      return id(t_heat).state - id(t_ref).state - id(dt_offset);
    filters:
      - sliding_window_moving_average: { window_size: 8, send_every: 1 }

  - platform: template
    id: dt_base
    name: "ΔT Basis (30–90 min)"
    unit_of_measurement: "K"
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: dt_rise
    name: "ΔT Abweichung von Basis"
    unit_of_measurement: "K"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    name: "Kalibrierung Offset"
    unit_of_measurement: "K"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return id(dt_offset);'

binary_sensor:
  - platform: template
    id: quiet
    name: "Ruhephase (Basis gültig)"
  - platform: template
    id: leak_micro
    name: "Leckage-Verdacht Mikro"
    device_class: problem
  - platform: template
    id: leak_large
    name: "Leckage-Verdacht Dauerfluss"
    device_class: problem

interval:
  # Sicherheitsabschaltung: Heizung aus bei > 30 °C oder Sensorausfall
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(heater_on).state && (isnan(id(t_heat).state) || id(t_heat).state > 30.0f);'
          then:
            - switch.turn_off: heater_on
            - logger.log:
                level: WARN
                format: "Heizung abgeschaltet: Übertemperatur oder Sensorfehler"

  # Leckauswertung: gleitende Basis, Sprung-Erkennung, Dauerfluss
  - interval: 60s
    then:
      - lambda: |-
          const int N = 60, GAP = 15;                // Basisfenster: 15–59 min zurück
          static float h[60];
          static int n = 0, i = 0, low_cnt = 0, rise_cnt = 0;
          static float last_q = NAN;
          float dt = id(delta_t).state;
          if (isnan(dt) || !id(heater_on).state) {
            n = 0; i = 0; low_cnt = 0; rise_cnt = 0;
            id(leak_micro).publish_state(id(leak_latched));
            id(leak_large).publish_state(false);
            return;
          }
          h[i] = dt; i = (i + 1) % N; if (n < N) n++;
          if (n < N) return;                         // 60 min Vorlauf
          auto ago = [&](int k) { return h[(i - 1 - k + 2 * N) % N]; };

          float cur = 0;                             // aktuell: Mittel letzte 5 min
          for (int k = 0; k < 5; k++) cur += ago(k);
          cur /= 5;

          float sum = 0, mn = 1e9, mx = -1e9;        // Basis: 15–59 min zurück
          for (int k = GAP; k < N; k++) {
            float v = ago(k); sum += v;
            if (v < mn) mn = v; if (v > mx) mx = v;
          }
          float base = sum / (N - GAP);
          bool q = (mx - mn) < 0.10f;                // keine Entnahme im Basisfenster
          if (q) last_q = base;

          id(quiet).publish_state(q);
          id(dt_base).publish_state(base);
          id(dt_rise).publish_state(cur - base);

          // Regel 1: Sprung nach oben aus Ruhe (3 min bestätigt) -> Mikroleck, gespeichert
          float thr = id(rise_thr).state;
          if (q && cur - base > thr) rise_cnt++; else rise_cnt = 0;
          if (!id(leak_latched) && rise_cnt >= 3) {
            id(leak_latched) = true;
            ESP_LOGW("leak", "Mikroleck-Verdacht: +%.3f K ueber Basis %.3f K", cur - base, base);
          }
          id(leak_micro).publish_state(id(leak_latched));

          // Regel 2: >90 min deutlich unter letzter Ruhebasis -> Dauerfluss
          if (!isnan(last_q) && cur < last_q - 0.3f) low_cnt++; else low_cnt = 0;
          id(leak_large).publish_state(low_cnt >= 90);
